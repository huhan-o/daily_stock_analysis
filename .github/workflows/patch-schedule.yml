name: Patch Schedule

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Patch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          echo "" | base64 -d > /tmp/patch_schedule.py
          python3 /tmp/patch_schedule.py
          git rm -q .github/workflows/patch-schedule.yml
          git add -A
          git diff --cached --stat
          git commit -m "ci: change daily schedule to 21:23 Asia/Shanghai"
          git log --oneline -2
          git push origin main
