name: Fix Changelog

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Fix
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch --no-tags upstream main
          git show upstream/main:docs/CHANGELOG.md > /tmp/upstream_changelog.md
          echo "" | base64 -d > /tmp/fix.py
          python3 /tmp/fix.py docs/CHANGELOG.md /tmp/upstream_changelog.md docs/CHANGELOG.md
          git rm -q .github/workflows/fix-changelog.yml
          git add docs/CHANGELOG.md
          git commit -m "docs: remove duplicated changelog entries from union merge"
          git log --oneline -2
          git push origin main
