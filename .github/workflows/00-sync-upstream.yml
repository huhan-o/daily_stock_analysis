name: Sync Upstream

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - name: Sync
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git show HEAD:docs/CHANGELOG.md | sed -n '12,16p' > /tmp/our_bullets.md
          echo "bullets lines: $(wc -l < /tmp/our_bullets.md)"
          cat /tmp/our_bullets.md
          git remote add upstream https://github.com/ZhuLinsen/daily_stock_analysis.git
          git fetch --no-tags upstream main
          git merge --no-commit --no-ff upstream/main || true
          git status --short | head -20
          git checkout --theirs -- docs/CHANGELOG.md
          python3 -c "p='docs/CHANGELOG.md'; b=open('/tmp/our_bullets.md',encoding='utf-8').read().rstrip(); t=open(p,encoding='utf-8').read(); i=t.index('## [3.33.0]'); open(p,'w',encoding='utf-8').write(t[:i]+b+'\n\n'+t[i:])"
          git add -A
          git commit -m "chore: sync upstream main into fork"
          git log --oneline -3
          git push origin main
